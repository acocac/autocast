# @package _global_
defaults:
- override /datamodule: carra2_sample
- override /encoder@model.encoder: permute_concat
- override /decoder@model.decoder: channels_last
- override /processor@model.processor: swin_large
- override /eval: eval
- _self_

experiment_name: swin_large_carra2

datamodule:
  batch_size: 4
  data_path: /gws/pw/j07/aria_giant/wip/draft/acocac/autocast/greenland/input/sample_1024_512_flatten
  normalization_path: /gws/pw/j07/aria_giant/wip/draft/acocac/autocast/greenland/input/sample_1024_512_flatten/stats.yaml

logging:
  wandb:
    enabled: true

optimizer:
  learning_rate: 0.0001

model:
  train_in_latent_space: false
  loss_func:
    _target_: torch.nn.MSELoss
  encoder:
    in_channels: 1
  processor:
    out_channels: 1
    patch_size: 16

trainer:
  max_epochs: 5
  callbacks:
  # Progress snapshots every ~5% of optimizer steps. Keeping all of them makes
  # it practical to inspect how calibration evolves across the run.
  - _target_: autocast.callbacks.checkpoint.ProgressModelCheckpoint
    save_top_k: -1
    every_n_train_steps_fraction: 0.5
    save_last: true
    filename: "snapshot-{progress_token}-{epoch:04d}-{step:08d}"
    auto_insert_metric_name: false
    # Best checkpoint on the primary validation objective.
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: false # rolling callback above owns last.ckpt
    filename: "best-val-{epoch:04d}-{val_loss:.4f}"
    auto_insert_metric_name: false
  # Plot scalar validation metric histories and custom metric diagnostics
  # such as the MultiCoverage reliability curve at each validation end.
  - _target_: autocast.callbacks.metrics.ValidationMetricPlotCallback
    metric_prefixes: [ "val_" ]
    dirname: "validation_metrics"
    filename: "validation_metrics.png"
    max_cols: 3
    save_local: true
    log_to_logger: true
    plot_metric_objects: true
